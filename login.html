<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Future Plus Study Classes</title>

    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
        }

        .logo {
            width: 95px;
            height: 95px;
            object-fit: contain;
            display: block;
            margin: 0 auto 15px;
            border-radius: 50%;
        }

        .title {
            text-align: center;
            font-size: 26px;
            margin: 0;
            color: #172033;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin: 8px 0 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 700;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .forgot-row {
            text-align: right;
            margin: -5px 0 20px;
        }

        #forgotPassword {
            color: #2563eb;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        #forgotPassword:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
        }

        .message.info {
            background: #dbeafe;
            color: #1e40af;
        }

        .register-section {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #555;
        }

        .register-section a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

        .register-section a:hover {
            text-decoration: underline;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }

        .home-link:hover {
            color: #2563eb;
        }

        @media (max-width: 480px) {

            .login-card {
                padding: 25px 20px;
            }

            .title {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <!-- LOGO -->
            <img
                src="assets/images/logo.jpg"
                alt="Future Plus Study Classes Logo"
                class="logo"
            >

            <!-- TITLE -->
            <h1 class="title">
                Welcome Back
            </h1>

            <p class="subtitle">
                Future Plus Study Classes
            </p>

            <!-- MESSAGE -->
            <div
                id="loginMessage"
                class="message"
                role="alert"
            ></div>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- FORGOT PASSWORD -->
                <div class="forgot-row">

                    <span id="forgotPassword">
                        Forgot Password?
                    </span>

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    id="loginBtn"
                    class="login-btn"
                >
                    Login
                </button>

            </form>


            <!-- REGISTER -->
            <div class="register-section">

                New Student?

                <a href="register.html">
                    Create Account
                </a>

            </div>


            <!-- HOME -->
            <a
                href="index.html"
                class="home-link"
            >
                ← Back to Home
            </a>

        </div>

    </main>


    <!-- ========================================
         SUPABASE
    ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="assets/js/supabase.js"></script>

    <script src="assets/js/auth.js"></script>

    <script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("../service-worker.js")
            .then(reg => {
                console.log("PWA Ready:", reg.scope);
            })
            .catch(err => {
                console.error("PWA Error:", err);
            });
    });
}
</script>
</body>

</html>
<head>
    <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2563eb">
</head>
