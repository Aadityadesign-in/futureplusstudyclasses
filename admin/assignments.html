<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assignments | Future Plus Study Classes</title>

    <link rel="stylesheet" href="../assets/css/style.css">

    <style>
        body {
            background: #f4f7fb;
        }

        .admin-header {
            background: white;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0,0,0,.08);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 50%;
        }

        .brand h2 {
            margin: 0;
            font-size: 19px;
        }

        .brand small {
            color: #777;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .page {
            max-width: 1250px;
            margin: auto;
            padding: 28px 18px;
        }

        .page-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
        }

        .page-title h1 {
            margin: 0;
            font-size: 28px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,.06);
        }

        .stat-card span {
            color: #6b7280;
            font-size: 14px;
        }

        .stat-card strong {
            display: block;
            margin-top: 8px;
            font-size: 26px;
        }

        .blue {
            color: #2563eb;
        }

        .green {
            color: #16a34a;
        }

        .orange {
            color: #ea580c;
        }

        .red {
            color: #dc2626;
        }

        .panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,.06);
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filters input,
        .filters select {
            padding: 11px 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 13px 10px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #f8fafc;
            color: #374151;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge-active {
            background: #dcfce7;
            color: #166534;
        }

        .badge-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .edit-btn {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #6b7280;
        }

        /* Modal */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 14px;
            padding: 24px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-btn {
            border: none;
            background: #f3f4f6;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #374151;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        @media(max-width: 800px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .admin-header {
                padding: 12px;
            }

            .brand h2 {
                font-size: 15px;
            }

            .brand small {
                display: none;
            }
        }

        @media(max-width: 500px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .page-title {
                align-items: flex-start;
                flex-direction: column;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .header-actions .btn-secondary {
                display: none;
            }
        }
    </style>
</head>

<body>

<header class="admin-header">

    <div class="brand">
        <img src="../assets/images/logo.jpg" alt="Future Plus Logo">

        <div>
            <h2>Future Plus Study Classes</h2>
            <small>Assignment Management</small>
        </div>
    </div>

    <div class="header-actions">
        <button class="btn btn-secondary"
                onclick="location.href='dashboard.html'">
            Dashboard
        </button>

        <button class="btn btn-danger" id="logoutBtn">
            Logout
        </button>
    </div>

</header>


<main class="page">

    <div class="page-title">

        <div>
            <h1>📝 Assignment Management</h1>
            <p style="color:#6b7280;">
                Students ke assignments manage karein
            </p>
        </div>

        <button class="btn btn-primary" id="addAssignmentBtn">
            ➕ Add Assignment
        </button>

    </div>


    <!-- Stats -->

    <div class="stats">

        <div class="stat-card">
            <span>Total Assignments</span>
            <strong id="totalAssignments" class="blue">0</strong>
        </div>

        <div class="stat-card">
            <span>Active</span>
            <strong id="activeAssignments" class="green">0</strong>
        </div>

        <div class="stat-card">
            <span>Inactive</span>
            <strong id="inactiveAssignments" class="red">0</strong>
        </div>

        <div class="stat-card">
            <span>Students Assigned</span>
            <strong id="assignedStudents" class="orange">0</strong>
        </div>

    </div>


    <!-- Assignment Table -->

    <div class="panel">

        <div class="filters">

            <input
                type="search"
                id="searchInput"
                class="search-box"
                placeholder="🔎 Search assignment, student, course or batch..."
            >

            <select id="statusFilter">
                <option value="all">All Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>

            <button class="btn btn-secondary" id="refreshBtn">
                ↻ Refresh
            </button>

        </div>


        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>Assignment</th>
                        <th>Student</th>
                        <th>Course</th>
                        <th>Batch</th>
                        <th>Due Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="assignmentsTableBody">

                    <tr>
                        <td colspan="7" class="loading">
                            Loading assignments...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>


<!-- Assignment Modal -->

<div class="modal" id="assignmentModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="modalTitle">➕ Add Assignment</h2>

            <button
                class="close-btn"
                id="closeModalBtn">
                ×
            </button>

        </div>


        <form id="assignmentForm">

            <div class="form-group">

                <label>Student *</label>

                <select id="studentId" required>

                    <option value="">
                        Select Student
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Assignment Title *</label>

                <input
                    type="text"
                    id="assignmentTitle"
                    placeholder="Example: Physics Chapter 1 Questions"
                    required
                >

            </div>


            <div class="form-group">

                <label>Description</label>

                <textarea
                    id="description"
                    placeholder="Assignment ke baare me details..."
                ></textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Course</label>

                    <select id="courseId">

                        <option value="">
                            Select Course
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Batch</label>

                    <select id="batchId">

                        <option value="">
                            Select Batch
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Due Date</label>

                    <input
                        type="date"
                        id="dueDate"
                    >

                </div>


                <div class="form-group">

                    <label>Status</label>

                    <select id="status">

                        <option value="active">
                            Active
                        </option>

                        <option value="inactive">
                            Inactive
                        </option>

                    </select>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="cancelBtn">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="saveAssignmentBtn">
                    Save Assignment
                </button>

            </div>

        </form>

    </div>

</div>


<!-- IMPORTANT: scripts only once -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../assets/js/supabase.js"></script>

<script src="../assets/js/assignments-admin.js"></script>
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("../service-worker.js")
            .then(reg => {
                console.log("PWA Ready:", reg.scope);
            })
            .catch(err => {
                console.error("PWA Error:", err);
            });
    });
}
</script>
</body>
</html>
<head>
    <link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2563eb">
</head>
